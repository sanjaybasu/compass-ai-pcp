# Illness script: adults who report blood in vomit or stool (GI bleeding).
# Signed by a physician on 2026-10-28. Every value and its table location is listed in
# docs/clinical/SCRIPT_SOURCES_gi_fever_dka_ob.md. Priors are literature values; a later version replaces them with Waymark claims rates. Thresholds were drafted and accepted at physician review; they are not from a formal decision analysis.
#
# Source caution: the Srygley 2012 JAMA (Rational Clinical Examination) table was
# read in a verbatim reproduction (Approach to Internal Medicine, 2015, PMC7123601),
# not in the JAMA PDF. That reproduction gives no CIs. The CIs below come from the
# Srygley abstract, which we read on PubMed. The reviewer must check the values
# against the JAMA table.
#
# Population caution: the location LRs (upper vs lower) and the 63% upper-GI prior
# come from adults evaluated in EDs or admitted for acute GI bleeding. The
# severity LRs are conditional on an upper GI bleed. A person who texts about a
# small amount of red blood on toilet paper is a lower-risk population.
#
# Not candidate diagnoses (no sourced likelihood ratios; see the sources doc):
# colorectal cancer, anal fissure, inflammatory bowel disease, variceal bleeding
# as a separate diagnosis. Hemodynamic red flags with no remote LR (dizziness on
# standing, chest pain) belong in the lane gate as hard escalation rules.
complaint: gi_bleeding
version: "1.0.0"
lane: undifferentiated_high_risk
clinical_review:
  approved_by: "Sanjay Basu, MD, PhD"
  approved_on: "2026-10-28"
# must_ask: Glasgow-Blatchford history items (melena, syncope) plus hematemesis; signed 2026-10-28
must_ask: [melena_history, hematemesis, syncope]
features:
  - id: melena_history
    question: "Have you had black, sticky poop that looks like tar?"
    remote_askable: true
  - id: hematemesis
    question: "Have you thrown up blood, or throw-up that looks like coffee grounds?"
    remote_askable: true
  - id: syncope
    question: "Have you passed out or fainted since the bleeding started?"
    remote_askable: true
  - id: clots_in_stool
    question: "Have you seen clumps of blood (clots) in or on your poop?"
    remote_askable: true
  - id: prior_ugib
    question: "Has a doctor ever told you that you bled from your stomach or the tube to your stomach?"
    remote_askable: true
  - id: age_under_50
    question: "Are you younger than 50?"
    remote_askable: true   # also available from the member record
  - id: cirrhosis
    question: "Has a doctor told you that you have cirrhosis (bad scarring of the liver)?"
    remote_askable: true
  - id: pulse_over_100
    question: "If you have a home blood pressure cuff, sit still for 2 minutes and check. Is your pulse (heart rate) over 100?"
    remote_askable: true   # only with a home blood pressure cuff or pulse oximeter; source measured pulse in the ED
  - id: bun_cr_ratio_over_30
    question: "Serum urea nitrogen to creatinine ratio more than 30"
    remote_askable: false  # lab test
  - id: glasgow_blatchford_above_0
    question: "Glasgow-Blatchford score more than 0 (needs urea, hemoglobin, blood pressure, pulse)"
    remote_askable: false  # needs labs and measured vital signs
diagnoses:
  - id: upper_gi_bleed
    label: "Upper GI bleed (source in the esophagus, stomach, or duodenum)"
    cannot_miss: false
    prior:
      p: 0.63
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Srygley FD et al. JAMA 2012;307(10):1072-9 (PMID 22416103), abstract: acute UGIB prevalence 63% (95% CI 51%-73%) among adults with acute GI bleeding in ED or admitted"
    lrs:
      prior_ugib: {lr_pos: 6.2, lr_neg: 0.81, source: "Srygley 2012 JAMA (PMID 22416103) table, Prior history of UGIB; read in reproduction PMC7123601; no CI"}
      age_under_50: {lr_pos: 3.5, lr_neg: 0.80, source: "Srygley 2012 JAMA (PMID 22416103) table, Age <50 years; read in reproduction PMC7123601; no CI"}
      cirrhosis: {lr_pos: 3.1, lr_neg: 0.97, source: "Srygley 2012 JAMA (PMID 22416103) table, Cirrhosis (UGIB vs LGIB); read in reproduction PMC7123601; no CI"}
      melena_history: {lr_pos: 5.9, lr_neg: 0.27, source: "Srygley 2012 JAMA (PMID 22416103) abstract and table, History of melena, LR+ range 5.1-5.9 and LR- range 0.06-0.27; conservative ends used (upper LR+, upper LR-)"}
      clots_in_stool: {lr_pos: 0.05, lr_neg: 1.2, lr_pos_ci: [0.01, 0.38], source: "Srygley 2012 JAMA (PMID 22416103) abstract (LR+ and CI) and table (LR- 1.2, read in reproduction PMC7123601)"}
      bun_cr_ratio_over_30: {lr_pos: 7.5, lr_neg: 0.53, lr_pos_ci: [2.8, 12.0], source: "Srygley 2012 JAMA (PMID 22416103) abstract (LR+ and CI) and table (LR- 0.53, read in reproduction PMC7123601)"}
  - id: ugib_needing_intervention
    label: "Upper GI bleed that needs urgent intervention (transfusion, endoscopic therapy, or surgery)"
    cannot_miss: true
    prior:
      p: 0.227
      source: "Literature value (a later version replaces it with the Waymark claims rate); DERIVED from Srygley FD et al. JAMA 2012 (PMID 22416103) abstract: UGIB prevalence 63% x severe bleeding in 36% (95% CI 29%-44%) of clinically diagnosed UGIB = 0.227 of adults with acute GI bleeding"
    thresholds: {benefit: 30, harm: 1, test_se: 0.95, test_sp: 0.8, test_harm: 0.05, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    lrs:
      syncope: {lr_pos: 3.0, lr_neg: 0.95, group: hemodynamic, source: "Srygley 2012 JAMA (PMID 22416103) table, Syncope (need for urgent evaluation of UGIB); read in reproduction PMC7123601; no CI"}
      pulse_over_100: {lr_pos: 4.9, lr_neg: 0.34, lr_pos_ci: [3.2, 7.6], group: hemodynamic, source: "Srygley 2012 JAMA (PMID 22416103) abstract (tachycardia LR+ and CI) and table (Pulse rate >100/min LR- 0.34, read in reproduction PMC7123601)"}
      cirrhosis: {lr_pos: 3.2, lr_neg: 0.89, source: "Srygley 2012 JAMA (PMID 22416103) table, Cirrhosis (need for urgent evaluation of UGIB); read in reproduction PMC7123601; no CI"}
      hematemesis: {lr_pos: 1.27, lr_neg: 0.76, lr_pos_ci: [1.09, 1.48], lr_neg_ci: [0.64, 0.90], group: bleeding_presentation, source: "DERIVED from Kim SS et al. Korean J Intern Med 2019;34(2):288-95 (PMID 29232942) Table 1 counts: hematemesis 197/329 endoscopic hemostasis vs 134/284 no hemostasis; presumed acute UGIB; log-method 95% CI"}
      melena_history: {lr_pos: 0.94, lr_neg: 1.15, lr_pos_ci: [0.85, 1.04], lr_neg_ci: [0.91, 1.46], group: bleeding_presentation, source: "DERIVED from Kim 2019 Korean J Intern Med (PMID 29232942) Table 1 counts: melena 221/329 vs 203/284; log-method 95% CI"}
      glasgow_blatchford_above_0: {lr_pos: 1.2, lr_neg: 0.02, source: "Srygley 2012 JAMA (PMID 22416103) abstract (Blatchford score 0 summary LR 0.02, 95% CI 0-0.05) and table (LR+ 1.2, read in reproduction PMC7123601); CI omitted because its lower limit is 0"}
  - id: lower_gi_bleed
    label: "Lower GI bleed (source in the colon, rectum, or small bowel beyond the duodenum)"
    cannot_miss: true
    prior:
      p: 0.37
      source: "Literature value (a later version replaces it with the Waymark claims rate); DERIVED as complement of Srygley 2012 JAMA (PMID 22416103) abstract UGIB prevalence 63% among adults with acute GI bleeding"
    thresholds: {benefit: 5, harm: 1, test_se: 0.9, test_sp: 0.8, test_harm: 0.05, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    lrs:
      prior_ugib: {lr_pos: 0.16, lr_neg: 1.23, source: "DERIVED as reciprocal of Srygley 2012 (PMID 22416103) UGIB LRs (LGIB = complement among acute GI bleeding)"}
      age_under_50: {lr_pos: 0.29, lr_neg: 1.25, source: "DERIVED as reciprocal of Srygley 2012 (PMID 22416103) UGIB LRs (LGIB = complement among acute GI bleeding)"}
      cirrhosis: {lr_pos: 0.32, lr_neg: 1.03, source: "DERIVED as reciprocal of Srygley 2012 (PMID 22416103) UGIB LRs (LGIB = complement among acute GI bleeding)"}
      melena_history: {lr_pos: 0.17, lr_neg: 3.70, source: "DERIVED as reciprocal of Srygley 2012 (PMID 22416103) UGIB LRs (LGIB = complement); from LR+ 5.9 and LR- 0.27"}
      clots_in_stool: {lr_pos: 20.0, lr_neg: 0.83, lr_pos_ci: [2.63, 100.0], source: "DERIVED as reciprocal of Srygley 2012 (PMID 22416103) UGIB LRs (LGIB = complement); CI limits are reciprocals"}
      bun_cr_ratio_over_30: {lr_pos: 0.13, lr_neg: 1.89, lr_pos_ci: [0.083, 0.36], source: "DERIVED as reciprocal of Srygley 2012 (PMID 22416103) UGIB LRs (LGIB = complement); CI limits are reciprocals"}
  - id: hemorrhoidal_bleeding
    label: "Hemorrhoidal bleeding"
    cannot_miss: false
    prior:
      p: 0.087
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Jones R et al. BMJ 2009;339:b3094 (PMID 19679615), Table 4: haemorrhoids recorded within 90 days in 1,334 of 15,289 UK primary-care patients with first rectal bleeding (596 women 7.8%, 738 men 10.0%)"
    # lrs: none verified for hemorrhoids vs other causes of bleeding. See the sources doc.
    lrs: {}
