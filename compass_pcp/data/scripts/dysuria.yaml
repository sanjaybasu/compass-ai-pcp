# Illness script: dysuria in non-pregnant women aged 18-64.
# Signed by a physician on 2026-10-28. Every value and its table location is listed in
# docs/clinical/SCRIPT_SOURCES.md. Priors are literature values; a later version replaces them with Waymark claims rates. Thresholds were drafted and accepted at physician review; they are not from a formal decision analysis.
#
# Eligibility exclusions (handled by the lane gate, not by this script):
#   - Pregnancy or possible pregnancy, including ectopic pregnancy. No
#     likelihood ratios for ectopic pregnancy in a dysuria population were
#     verified, so it is not a candidate diagnosis here.
#   - Men, age < 18 or > 64, urinary catheter, known structural or functional
#     urinary tract abnormality, immunosuppression.
#
# Known gaps (see SCRIPT_SOURCES.md, "Unverified and omitted"):
#   - pyelonephritis has NO sourced remote likelihood ratios. With the drafted thresholds below its prior sits in the middle zone, so the
#     engine defers every encounter to a clinician until sourced LRs are added.
#   - vaginitis (BV / candidiasis) has NO sourced symptom LRs (Anderson 2004
#     JAMA tables not read); it carries a prior only.
complaint: dysuria
version: "1.0.0"
lane: dysuria
clinical_review:
  approved_by: "Sanjay Basu, MD, PhD"
  approved_on: "2026-10-28"
# must_ask: pyelonephritis and STI red flags; signed 2026-10-28
must_ask: [fever, flank_pain, any_vaginal_symptom]
features:
  - id: dysuria
    question: "Does it burn or hurt when you pee?"
    remote_askable: true
  - id: urinary_frequency
    question: "Do you need to pee much more often than usual?"
    remote_askable: true
  - id: hematuria
    question: "Have you seen blood in your pee, or pee that looks pink, red, or brown?"
    remote_askable: true
  - id: back_pain
    question: "Do you have pain in your back?"
    remote_askable: true
  - id: flank_pain
    question: "Do you have pain in your side, below your ribs?"
    remote_askable: true
  - id: lower_abdominal_pain
    question: "Do you have pain low in your belly?"
    remote_askable: true
  - id: fever
    question: "Have you had a fever (temperature of 100.4 F or higher) with this?"
    remote_askable: true
  - id: vaginal_discharge
    question: "Have you noticed new or different fluid coming from your vagina?"
    remote_askable: true
  - id: vaginal_irritation
    question: "Does the area around your vagina itch, burn, or feel sore on the outside?"
    remote_askable: true
  - id: any_vaginal_symptom
    question: "Do you have any vaginal discharge, itching, bleeding that is not your period, or sores?"
    remote_askable: true
  - id: cva_tenderness_exam
    question: "Costovertebral angle tenderness on clinician exam"
    remote_askable: false   # in-person exam; self-percussion not considered reliable
  - id: vaginal_discharge_exam
    question: "Vaginal discharge seen on clinician pelvic exam"
    remote_askable: false   # in-person exam
  - id: dipstick_le_or_nitrite
    question: "Urine dipstick positive for leukocyte esterase or nitrite"
    remote_askable: false   # in-office test
diagnoses:
  - id: uncomplicated_cystitis
    label: "Acute uncomplicated cystitis (UTI)"
    cannot_miss: false
    prior:
      p: 0.48
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Bent S et al. JAMA 2002;287(20):2701-10 (PMID 12020306), summary prevalence of UTI in symptomatic women 48% (95% CI 41%-55%), Results text"
    lrs:
      dysuria: {lr_pos: 1.5, lr_neg: 0.5, lr_pos_ci: [1.2, 2.0], lr_neg_ci: [0.3, 0.7], group: irritative_voiding, source: "Bent 2002 JAMA (PMID 12020306) Table 2, Dysuria summary"}
      urinary_frequency: {lr_pos: 1.8, lr_neg: 0.6, lr_pos_ci: [1.1, 3.0], lr_neg_ci: [0.4, 1.0], group: irritative_voiding, source: "Bent 2002 JAMA (PMID 12020306) Table 2, Frequency summary"}
      hematuria: {lr_pos: 2.0, lr_neg: 0.9, lr_pos_ci: [1.3, 2.9], lr_neg_ci: [0.9, 1.0], source: "Bent 2002 JAMA (PMID 12020306) Table 2, Hematuria summary"}
      back_pain: {lr_pos: 1.6, lr_neg: 0.8, lr_pos_ci: [1.2, 2.1], lr_neg_ci: [0.7, 0.9], group: back_flank, source: "Bent 2002 JAMA (PMID 12020306) Table 2 (cont), Back Pain summary"}
      flank_pain: {lr_pos: 1.1, lr_neg: 0.9, lr_pos_ci: [0.9, 1.4], lr_neg_ci: [0.8, 1.1], group: back_flank, source: "Bent 2002 JAMA (PMID 12020306) Table 2, Flank Pain summary"}
      lower_abdominal_pain: {lr_pos: 1.1, lr_neg: 0.9, lr_pos_ci: [0.9, 1.4], lr_neg_ci: [0.8, 1.1], source: "Bent 2002 JAMA (PMID 12020306) Table 2, Lower Abdominal Pain summary"}
      fever: {lr_pos: 1.6, lr_neg: 0.9, lr_pos_ci: [1.0, 2.6], lr_neg_ci: [0.9, 1.0], source: "Bent 2002 JAMA (PMID 12020306) Table 2, Fever summary"}
      vaginal_discharge: {lr_pos: 0.3, lr_neg: 3.1, lr_pos_ci: [0.1, 0.9], lr_neg_ci: [1.0, 9.3], group: vaginal_sx, source: "Bent 2002 JAMA (PMID 12020306) Table 2, Vaginal Discharge (history) summary"}
      vaginal_irritation: {lr_pos: 0.2, lr_neg: 2.7, lr_pos_ci: [0.1, 0.9], lr_neg_ci: [0.9, 8.5], group: vaginal_sx, source: "Bent 2002 JAMA (PMID 12020306) Table 2 (cont), Vaginal Irritation summary"}
      cva_tenderness_exam: {lr_pos: 1.7, lr_neg: 0.9, lr_pos_ci: [1.1, 2.5], lr_neg_ci: [0.8, 1.0], source: "Bent 2002 JAMA (PMID 12020306) Table 2 (cont), Costovertebral Angle Tenderness on Physical Examination summary"}
      vaginal_discharge_exam: {lr_pos: 0.7, lr_neg: 1.1, lr_pos_ci: [0.5, 0.9], lr_neg_ci: [1.0, 1.2], source: "Bent 2002 JAMA (PMID 12020306) Table 2 (cont), Vaginal Discharge on Physical Examination summary"}
      dipstick_le_or_nitrite: {lr_pos: 4.2, lr_neg: 0.3, source: "Bent 2002 JAMA (PMID 12020306) Table 2 (cont), Dipstick Urinalysis (Hurlbut and Littenberg); no CI reported"}
  - id: pyelonephritis
    label: "Acute pyelonephritis"
    red_flags: [fever, flank_pain]
    cannot_miss: true
    prior:
      p: 0.035
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Fernandez-Garcia S et al. Front Pharmacol 2025;16:1593910 (PMID 40994650), Table 1: 29,586 of 852,116 women with a primary-care UTI diagnosis (3.5%) had pyelonephritis"
    thresholds: {benefit: 30, harm: 1, test_se: 0.9, test_sp: 0.8, test_harm: 0.05, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    # lrs: none verified for pyelonephritis vs other causes of dysuria. See SCRIPT_SOURCES.md.
    lrs: {}
  - id: sti_cervicitis_pid
    label: "Sexually transmitted infection (chlamydia, gonorrhea, or trichomoniasis), including cervicitis or PID"
    cannot_miss: true
    prior:
      p: 0.26
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Tomas ME et al. J Clin Microbiol 2015;53(8):2686-92 (PMID 26063863), Table 3: positive STI test in 42 of 161 (26%) ED women with >=1 UTI-related symptom"
    thresholds: {benefit: 10, harm: 1, test_se: 0.95, test_sp: 0.99, test_harm: 0.02, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    lrs:
      any_vaginal_symptom: {lr_pos: 1.95, lr_neg: 0.42, lr_pos_ci: [1.46, 2.61], lr_neg_ci: [0.25, 0.71], source: "DERIVED from Tomas 2015 J Clin Microbiol (PMID 26063863) Table 3 counts: STI+ 31/76 with vs 11/85 without vaginal symptoms among women with >=1 UTI-related symptom; log-method 95% CI"}
  - id: vaginitis
    label: "Vaginitis, non-STI (bacterial vaginosis or vulvovaginal candidiasis)"
    cannot_miss: false
    prior:
      p: 0.23
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Tomas ME et al. J Clin Microbiol 2015 (PMID 26063863), Table 2: clue cells >=20% in 25 of 110 tested (23%); yeast 13 of 111 (12%); tested subset only"
    # lrs: none verified (Anderson MR et al. JAMA 2004 tables not read). See SCRIPT_SOURCES.md.
    lrs: {}
