# Illness script: acute sinus symptoms in adults (URI lane).
# Signed by a physician on 2026-10-28. Every value and its table location is listed in
# docs/clinical/SCRIPT_SOURCES_uri_eye_ear.md. Priors are literature values; a later version replaces them with Waymark claims rates. Thresholds were drafted and accepted at physician review; they are not from a formal decision analysis.
#
# Population of the source studies: adults with clinically suspected acute
# rhinosinusitis (ARS) in primary care, ED, or ENT clinics (Ebell 2019 Table 1).
# The bacterial reference standard is a positive bacterial culture or purulent
# fluid on antral puncture (Ebell 2019 Table 4).
#
# Facial-pain findings share group "facial_pain" and purulence findings share
# group "purulence"; their joint accuracy is not reported.
#
# Orbital or intracranial complication (cannot-miss) has NO sourced likelihood
# ratios. Its red-flag features are in must_ask so that the engine asks them,
# but a PRESENT answer does not change any posterior in this script. A present
# red flag must escalate through the ANCHOR red-flag floor
# (anchor_bridge.py::red_flag_floor) or a lane-gate hard rule. See
# SCRIPT_SOURCES_uri_eye_ear.md, "Engine behavior".
complaint: acute_sinusitis
version: "1.0.0"
lane: uri
clinical_review:
  approved_by: "Sanjay Basu, MD, PhD"
  approved_on: "2026-10-28"
# must_ask: orbital and intracranial complication red flags; signed 2026-10-28
must_ask: [periorbital_swelling, vision_change, severe_headache, confusion_or_drowsiness]
features:
  - id: cacosmia
    question: "Do you smell or taste something bad, like rotten food, coming from your nose or the back of your throat?"
    remote_askable: true
  - id: tooth_pain
    question: "Do your upper teeth hurt?"
    remote_askable: true
  - id: purulent_nasal_discharge
    question: "Is the mucus from your nose thick and yellow or green?"
    remote_askable: true
  - id: pain_bending_forward
    question: "Does the pain in your face get worse when you bend forward?"
    remote_askable: true
  - id: maxillary_tenderness
    question: "Press gently on your cheeks, below your eyes. Does it hurt more on one side or both?"
    remote_askable: true   # guided self-exam; source studies used clinician palpation
  - id: purulent_discharge_exam
    question: "Pus seen in the nose on clinician exam"
    remote_askable: false  # in-person exam
  - id: periorbital_swelling
    question: "Is the skin around your eye swollen, red, or puffy?"
    remote_askable: true
  - id: vision_change
    question: "Has your eyesight changed? For example, do you see double, see blurry, or have pain when you move your eye?"
    remote_askable: true
  - id: severe_headache
    question: "Do you have a very bad headache, or a stiff neck?"
    remote_askable: true
  - id: confusion_or_drowsiness
    question: "Are you (or the person you are writing for) confused or very hard to wake up?"
    remote_askable: true
diagnoses:
  - id: acute_bacterial_rhinosinusitis
    label: "Acute bacterial rhinosinusitis"
    cannot_miss: false
    prior:
      p: 0.31
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Ebell MH et al. Ann Fam Med 2019;17(2):164-172 (PMID 30858261), Table 2: pooled ABRS prevalence by bacterial culture 31% (95% CI 24-40) in adults with suspected ARS"
    lrs:
      cacosmia: {lr_pos: 4.3, lr_neg: 0.86, lr_pos_ci: [0.94, 14], lr_neg_ci: [0.76, 0.99], source: "Ebell 2019 Ann Fam Med (PMID 30858261) Table 4, Cacosmia (3 studies)"}
      tooth_pain: {lr_pos: 2.0, lr_neg: 0.77, lr_pos_ci: [1.1, 3.7], lr_neg_ci: [0.50, 0.96], group: facial_pain, source: "Ebell 2019 Ann Fam Med (PMID 30858261) Table 4, Pain in teeth (3 studies)"}
      purulent_nasal_discharge: {lr_pos: 1.3, lr_neg: 0.74, lr_pos_ci: [0.99, 1.6], lr_neg_ci: [0.47, 1.0], group: purulence, source: "Ebell 2019 Ann Fam Med (PMID 30858261) Table 4, Purulent nasal discharge, symptom (3 studies)"}
      pain_bending_forward: {lr_pos: 1.0, lr_neg: 0.95, lr_pos_ci: [0.87, 1.3], lr_neg_ci: [0.69, 1.3], group: facial_pain, source: "Ebell 2019 Ann Fam Med (PMID 30858261) Table 4, Pain bending forward (3 studies)"}
      maxillary_tenderness: {lr_pos: 0.86, lr_neg: 1.2, lr_pos_ci: [0.23, 2.2], lr_neg_ci: [0.55, 2.1], group: facial_pain, source: "Ebell 2019 Ann Fam Med (PMID 30858261) Table 4, Sinus tenderness, maxillary, physical examination (5 studies)"}
      purulent_discharge_exam: {lr_pos: 0.88, lr_neg: 1.2, lr_pos_ci: [0.36, 1.9], lr_neg_ci: [0.57, 1.8], group: purulence, source: "Ebell 2019 Ann Fam Med (PMID 30858261) Table 4, Nasal discharge, purulent, physical examination (5 studies)"}
  - id: non_bacterial_rhinosinusitis
    label: "Viral or other non-bacterial sinus symptoms (viral URI or viral rhinosinusitis)"
    cannot_miss: false
    prior:
      p: 0.69
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Ebell MH et al. Ann Fam Med 2019 (PMID 30858261), complement of Table 2 pooled ABRS prevalence 31%"
    lrs:
      cacosmia: {lr_pos: 0.23, lr_neg: 1.16, lr_pos_ci: [0.07, 1.06], lr_neg_ci: [1.01, 1.32], source: "DERIVED as reciprocal of Ebell 2019 (PMID 30858261) Table 4 ABRS LRs (non-ABRS = complement)"}
      tooth_pain: {lr_pos: 0.50, lr_neg: 1.30, lr_pos_ci: [0.27, 0.91], lr_neg_ci: [1.04, 2.00], group: facial_pain, source: "DERIVED as reciprocal of Ebell 2019 (PMID 30858261) Table 4 ABRS LRs (non-ABRS = complement)"}
      purulent_nasal_discharge: {lr_pos: 0.77, lr_neg: 1.35, lr_pos_ci: [0.62, 1.01], lr_neg_ci: [1.00, 2.13], group: purulence, source: "DERIVED as reciprocal of Ebell 2019 (PMID 30858261) Table 4 ABRS LRs (non-ABRS = complement)"}
      pain_bending_forward: {lr_pos: 1.00, lr_neg: 1.05, lr_pos_ci: [0.77, 1.15], lr_neg_ci: [0.77, 1.45], group: facial_pain, source: "DERIVED as reciprocal of Ebell 2019 (PMID 30858261) Table 4 ABRS LRs (non-ABRS = complement)"}
      maxillary_tenderness: {lr_pos: 1.16, lr_neg: 0.83, lr_pos_ci: [0.45, 4.35], lr_neg_ci: [0.48, 1.82], group: facial_pain, source: "DERIVED as reciprocal of Ebell 2019 (PMID 30858261) Table 4 ABRS LRs (non-ABRS = complement)"}
      purulent_discharge_exam: {lr_pos: 1.14, lr_neg: 0.83, lr_pos_ci: [0.53, 2.78], lr_neg_ci: [0.56, 1.75], group: purulence, source: "DERIVED as reciprocal of Ebell 2019 (PMID 30858261) Table 4 ABRS LRs (non-ABRS = complement)"}
  - id: orbital_or_intracranial_complication
    label: "Orbital or intracranial complication of sinusitis (orbital cellulitis or abscess, meningitis, brain abscess)"
    red_flags: [periorbital_swelling, vision_change, severe_headache, confusion_or_drowsiness]
    cannot_miss: true
    prior:
      p: 0.00003
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Hansen FS et al. Fam Pract 2012;29(2):147-53 (PMID 21896505), Abstract: severe ARS complications in an estimated 1 in 32,000 adult ARS cases (Netherlands, 2004)"
    thresholds: {benefit: 100, harm: 1, test_se: 0.95, test_sp: 0.90, test_harm: 0.02, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    # lrs: none verified. See SCRIPT_SOURCES_uri_eye_ear.md, "Unverified and omitted".
    lrs: {}
