# Illness script: acute cough (28 days or less) in adults (URI lane).
# Signed by a physician on 2026-10-28. Every value and its table location is listed in
# docs/clinical/SCRIPT_SOURCES_uri_eye_ear.md. Priors are literature values; a later version replaces them with Waymark claims rates. Thresholds were drafted and accepted at physician review; they are not from a formal decision analysis.
#
# Pneumonia and pertussis priors and most LRs come from the same population: the
# GRACE cohort of adults with acute cough (28 days or less) in European primary
# care (van Vugt 2013 BMJ; Teepe 2015 BJGP). Pneumonia LRs are DERIVED from the
# 2x2 counts in van Vugt 2013 Table 1 (reference standard: chest radiograph
# within 1 week). Pertussis cough-pattern LRs are the ADULT rows of Ebell 2017
# Table 3.
#
# Groups: "fever" (reported fever, measured temperature) and
# "pertussis_cough_pattern" (paroxysms, post-cough vomiting, whoop). Their joint
# accuracy is not reported.
#
# Not candidate diagnoses (no sourced likelihood ratios in a cough population;
# see SCRIPT_SOURCES_uri_eye_ear.md):
#   - pulmonary embolism
#   - COVID-19 and influenza as separate diagnoses (they sit inside the
#     non-pneumonia diagnosis here)
# `coughing_blood` has no LR. It is in must_ask so that the engine asks it, but
# a PRESENT answer does not change any posterior. It must escalate through the
# ANCHOR red-flag floor or a lane-gate hard rule.
complaint: cough_acute
version: "1.0.0"
lane: uri
clinical_review:
  approved_by: "Sanjay Basu, MD, PhD"
  approved_on: "2026-10-28"
# must_ask: pneumonia red flags (and hemoptysis for PE / other causes); signed 2026-10-28
must_ask: [fever_history, breathlessness, chest_pain, coughing_blood]
features:
  - id: fever_history
    question: "Have you had a fever (temperature of 100.4 F or higher) with this cough?"
    remote_askable: true
  - id: measured_temperature_high
    question: "If you have a thermometer, please take your temperature now. Is it higher than 100.0 F (37.8 C)?"
    remote_askable: true   # guided self-measurement; source used clinician measurement (> 37.8 C)
  - id: breathlessness
    question: "Do you get short of breath, or feel like you cannot get enough air?"
    remote_askable: true
  - id: runny_nose_absent
    question: "Is it true that you do NOT have a runny nose? (Answer yes if your nose is not runny.)"
    remote_askable: true
  - id: chest_pain
    question: "Do you have pain in your chest?"
    remote_askable: true
  - id: phlegm
    question: "Do you cough up mucus or phlegm?"
    remote_askable: true
  - id: pulse_over_100
    question: "Sit still for 5 minutes. Then count your pulse at your wrist for 30 seconds. Is the count more than 50?"
    remote_askable: true   # guided self-measurement (or a watch or pulse oximeter); source used clinician measurement
  - id: crackles
    question: "Crackles heard on lung exam by a clinician"
    remote_askable: false  # in-person exam
  - id: diminished_breath_sounds
    question: "Diminished vesicular breath sounds on lung exam by a clinician"
    remote_askable: false  # in-person exam
  - id: paroxysmal_cough
    question: "Does your cough come in long fits, where you cough many times in a row and cannot stop?"
    remote_askable: true
  - id: posttussive_vomiting
    question: "Do you sometimes throw up after a coughing fit?"
    remote_askable: true
  - id: whoop
    question: "After a coughing fit, do you make a loud 'whoop' sound when you breathe in?"
    remote_askable: true
  - id: cough_over_2_weeks
    question: "Have you had this cough for more than 2 weeks?"
    remote_askable: true
  - id: coughing_blood
    question: "Have you coughed up blood?"
    remote_askable: true
diagnoses:
  - id: community_acquired_pneumonia
    label: "Community-acquired pneumonia"
    cannot_miss: true
    prior:
      p: 0.050
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from van Vugt SF et al. BMJ 2013;346:f2450 (PMID 23633005), Table 1: radiographic pneumonia in 140 of 2820 adults with acute cough in primary care (5.0%)"
    thresholds: {benefit: 10, harm: 1, test_se: 0.90, test_sp: 0.95, test_harm: 0.05, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    lrs:
      fever_history: {lr_pos: 1.73, lr_neg: 0.63, lr_pos_ci: [1.49, 2.01], lr_neg_ci: [0.51, 0.76], group: fever, source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Fever (history): TP82 FN58 FP907 TN1773; log-method 95% CI"}
      measured_temperature_high: {lr_pos: 3.10, lr_neg: 0.89, lr_pos_ci: [2.04, 4.70], lr_neg_ci: [0.83, 0.95], group: fever, source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Temperature >37.8 C: TP22 FN118 FP136 TN2544; log-method 95% CI"}
      breathlessness: {lr_pos: 1.23, lr_neg: 0.71, lr_pos_ci: [1.09, 1.38], lr_neg_ci: [0.56, 0.91], source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Breathlessness: TP96 FN44 FP1498 TN1182; log-method 95% CI"}
      runny_nose_absent: {lr_pos: 1.56, lr_neg: 0.78, lr_pos_ci: [1.28, 1.91], lr_neg_ci: [0.68, 0.91], source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Runny nose absent: TP61 FN79 FP747 TN1933; log-method 95% CI"}
      chest_pain: {lr_pos: 1.25, lr_neg: 0.79, lr_pos_ci: [1.08, 1.45], lr_neg_ci: [0.65, 0.96], source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Chest pain: TP80 FN60 FP1224 TN1456; log-method 95% CI"}
      phlegm: {lr_pos: 1.08, lr_neg: 0.68, lr_pos_ci: [1.01, 1.16], lr_neg_ci: [0.45, 1.03], source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Phlegm: TP120 FN20 FP2119 TN561; log-method 95% CI"}
      pulse_over_100: {lr_pos: 3.46, lr_neg: 0.91, lr_pos_ci: [2.13, 5.64], lr_neg_ci: [0.86, 0.97], source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Tachycardia (pulse >100/min): TP17 FN123 FP94 TN2586; log-method 95% CI"}
      crackles: {lr_pos: 3.92, lr_neg: 0.74, lr_pos_ci: [2.98, 5.14], lr_neg_ci: [0.66, 0.83], source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Crackles: TP45 FN95 FP220 TN2460; log-method 95% CI"}
      diminished_breath_sounds: {lr_pos: 1.79, lr_neg: 0.89, lr_pos_ci: [1.29, 2.49], lr_neg_ci: [0.81, 0.97], source: "DERIVED from van Vugt 2013 BMJ (PMID 23633005) Table 1 counts, Diminished vesicular breathing: TP31 FN109 FP331 TN2349; log-method 95% CI"}
  - id: acute_bronchitis_or_viral_lrti
    label: "Acute bronchitis or other non-pneumonia cough (viral lower or upper respiratory infection)"
    cannot_miss: false
    prior:
      p: 0.950
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from van Vugt SF et al. BMJ 2013 (PMID 23633005), Table 1: no radiographic pneumonia in 2680 of 2820 adults with acute cough (95.0%)"
    lrs:
      fever_history: {lr_pos: 0.58, lr_neg: 1.60, lr_pos_ci: [0.50, 0.67], lr_neg_ci: [1.31, 1.95], group: fever, source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      measured_temperature_high: {lr_pos: 0.32, lr_neg: 1.13, lr_pos_ci: [0.21, 0.49], lr_neg_ci: [1.05, 1.21], group: fever, source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      breathlessness: {lr_pos: 0.82, lr_neg: 1.40, lr_pos_ci: [0.73, 0.92], lr_neg_ci: [1.09, 1.80], source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      runny_nose_absent: {lr_pos: 0.64, lr_neg: 1.28, lr_pos_ci: [0.52, 0.78], lr_neg_ci: [1.10, 1.48], source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      chest_pain: {lr_pos: 0.80, lr_neg: 1.27, lr_pos_ci: [0.69, 0.93], lr_neg_ci: [1.04, 1.54], source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      phlegm: {lr_pos: 0.92, lr_neg: 1.47, lr_pos_ci: [0.86, 0.99], lr_neg_ci: [0.97, 2.21], source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      pulse_over_100: {lr_pos: 0.29, lr_neg: 1.10, lr_pos_ci: [0.18, 0.47], lr_neg_ci: [1.03, 1.17], source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      crackles: {lr_pos: 0.26, lr_neg: 1.35, lr_pos_ci: [0.19, 0.34], lr_neg_ci: [1.21, 1.52], source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
      diminished_breath_sounds: {lr_pos: 0.56, lr_neg: 1.13, lr_pos_ci: [0.40, 0.77], lr_neg_ci: [1.03, 1.23], source: "DERIVED as reciprocal of van Vugt 2013 (PMID 23633005) Table 1 pneumonia LRs (no pneumonia = complement)"}
  - id: pertussis
    label: "Pertussis (whooping cough, Bordetella pertussis infection)"
    cannot_miss: false
    prior:
      p: 0.030
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Teepe J et al. Br J Gen Pract 2015;65(639):e662-7 (PMID 26412843), Table 1: acute pertussis in 93 of 3074 adults with acute cough in primary care (3.0%, 95% CI 2.5-3.7)"
    lrs:
      paroxysmal_cough: {lr_pos: 1.2, lr_neg: 0.50, lr_pos_ci: [1.04, 1.6], lr_neg_ci: [0.33, 0.75], group: pertussis_cough_pattern, source: "Ebell MH et al. J Am Board Fam Med 2017;30(3):308-19 (PMID 28484063) Table 3, Paroxysmal cough, Adults (6 studies)"}
      posttussive_vomiting: {lr_pos: 1.7, lr_neg: 0.83, lr_pos_ci: [1.3, 2.3], lr_neg_ci: [0.73, 0.93], group: pertussis_cough_pattern, source: "Ebell 2017 JABFM (PMID 28484063) Table 3, Posttussive vomiting, Adults (7 of 8 studies)"}
      whoop: {lr_pos: 1.2, lr_neg: 0.97, lr_pos_ci: [0.81, 1.8], lr_neg_ci: [0.81, 1.8], group: pertussis_cough_pattern, source: "Ebell 2017 JABFM (PMID 28484063) Table 3, Whooping cough, Adults (7 of 8 studies)"}
      fever_history: {lr_pos: 0.76, lr_neg: 1.0, lr_pos_ci: [0.45, 1.2], lr_neg_ci: [0.95, 1.1], group: fever, source: "Ebell 2017 JABFM (PMID 28484063) Table 3, Fever, all ages (7 of 8 studies); no adult-only row"}
      cough_over_2_weeks: {lr_pos: 1.60, lr_neg: 0.88, lr_pos_ci: [1.14, 2.26], lr_neg_ci: [0.78, 0.99], source: "DERIVED from Teepe 2015 BJGP (PMID 26412843) Table 2 counts, Cough duration >2 weeks before index consultation: TP25 FN68 FP500 TN2481; log-method 95% CI"}
