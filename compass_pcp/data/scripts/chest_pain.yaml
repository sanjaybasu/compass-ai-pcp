# Illness script: chest pain in adults (undifferentiated high-risk lane).
# Signed by a physician on 2026-10-28. Every value and its table location is listed in
# docs/clinical/SCRIPT_SOURCES_cardiopulm.md. Priors are literature values; a later version replaces them with Waymark claims rates. Thresholds were drafted and accepted at physician review; they are not from a formal decision analysis.
#
# The AI takes the history and escalates. It does not rule out ACS, PE, or aortic
# dissection: each of these needs an ECG, troponin, D-dimer, or imaging, so the
# rule-out features are remote_askable: false and the engine defers.
#
# Reference conditions differ by source and are not interchangeable:
#   - acs: Raat 2024 meta-analysis (ACS, mostly ED and pre-hospital studies);
#     known_vascular_disease uses Bosner 2010 "indication for urgent hospital
#     admission" (60% ACS) as a proxy reference condition.
#   - coronary_heart_disease: Bosner 2010, CHD stable or acute, primary care.
#   - pulmonary_embolism: Courtney 2010, VTE (PE or DVT) in ED patients tested for PE.
#   - aortic_dissection: Morello 2020, acute aortic syndrome in ED patients with
#     suspected AAS (prevalence 30%), so spectrum effects are large.
#
# Not candidate diagnoses or features (no sourced LRs; see sources doc):
#   pericarditis, pneumothorax, esophageal rupture, and Fanaroff 2015 / Swap 2005 /
#   Klompas 2002 / West 2007 values (full text not read).
# Hard escalation rules for the lane gate (not Bayesian): pain now with trouble
# breathing, fainting, or new weakness; pain at rest lasting 20 minutes or more.
complaint: chest_pain
version: "1.0.0"
lane: undifferentiated_high_risk
clinical_review:
  approved_by: "Sanjay Basu, MD, PhD"
  approved_on: "2026-10-28"
# must_ask: red flags for ACS, PE, and aortic dissection; signed 2026-10-28
must_ask: [known_vascular_disease, sweating, radiation_left_arm, history_vte, unilateral_leg_swelling, sudden_onset, ripping_tearing_pain]
features:
  # ACS and coronary heart disease
  - id: oppressive_pain
    question: "Does the pain feel like pressure, squeezing, or a heavy weight on your chest?"
    remote_askable: true
  - id: radiation_left_arm
    question: "Does the pain spread to your left arm?"
    remote_askable: true
  - id: radiation_right_arm
    question: "Does the pain spread to your right arm?"
    remote_askable: true
  - id: radiation_neck
    question: "Does the pain spread to your neck or jaw?"
    remote_askable: true
  - id: radiation_back
    question: "Does the pain spread to your back?"
    remote_askable: true
  - id: sweating
    question: "Did you break out in a sweat when the pain came on?"
    remote_askable: true
  - id: nausea_vomiting
    question: "Did you feel sick to your stomach or throw up with the pain?"
    remote_askable: true
  - id: known_vascular_disease
    question: "Has a doctor ever told you that you had a heart attack, blocked heart arteries, a stroke, or blocked leg arteries?"
    remote_askable: true   # patient report or record
  - id: known_heart_failure
    question: "Has a doctor ever told you that you have heart failure (a weak heart)?"
    remote_askable: true
  - id: known_diabetes
    question: "Do you have diabetes (high blood sugar)?"
    remote_askable: true
  - id: age_risk
    question: "Man aged 55 or older, or woman aged 65 or older (from the record)"
    remote_askable: true   # from the record
  - id: pain_worse_exercise
    question: "Does the pain come on or get worse when you walk fast, climb stairs, or do other hard activity?"
    remote_askable: true
  - id: patient_thinks_heart
    question: "Do you think this pain is coming from your heart?"
    remote_askable: true
  - id: stinging_pain
    question: "Is the pain sharp or stinging, like a needle?"
    remote_askable: true
  - id: cough
    question: "Do you have a cough right now?"
    remote_askable: true
  - id: chest_wall_tenderness_absent
    question: "No chest wall tenderness on clinician palpation"
    remote_askable: false  # in-person exam
  - id: pain_reproducible_palpation
    question: "Pain reproduced by clinician palpation of the chest wall"
    remote_askable: false  # in-person exam
  - id: localised_muscle_tension
    question: "Localised muscle tension on clinician exam"
    remote_askable: false  # in-person exam
  # Pulmonary embolism
  - id: history_vte
    question: "Have you ever had a blood clot in your leg or lung?"
    remote_askable: true
  - id: unilateral_leg_swelling
    question: "Is one of your legs more swollen than the other right now?"
    remote_askable: true   # patient report; source used clinician assessment
  - id: recent_surgery
    question: "Have you had surgery with general anesthesia (put to sleep) in the past 4 weeks?"
    remote_askable: true
  - id: immobilization
    question: "In the past few days, have you been stuck in bed, unable to move a limb, or had a leg in a cast?"
    remote_askable: true
  - id: active_cancer
    question: "Are you being treated for cancer right now (chemotherapy, radiation, or comfort care)?"
    remote_askable: true
  - id: pleuritic_pain
    question: "Does the pain get worse when you take a deep breath?"
    remote_askable: true
  - id: substernal_pain
    question: "Is the pain right behind your breastbone, in the middle of your chest?"
    remote_askable: true
  - id: hypoxemia
    question: "Oxygen saturation below 95% on pulse oximetry"
    remote_askable: false  # measured
  # Aortic dissection
  - id: sudden_onset
    question: "Did the pain start all at once, at full strength, in a few seconds?"
    remote_askable: true
  - id: severe_pain
    question: "Is this the worst pain you have ever felt?"
    remote_askable: true
  - id: ripping_tearing_pain
    question: "Does the pain feel like ripping or tearing?"
    remote_askable: true
  - id: known_thoracic_aneurysm
    question: "Has a doctor ever told you that the large blood vessel in your chest (the aorta) is enlarged?"
    remote_askable: true
  - id: hypertension
    question: "Do you have high blood pressure?"
    remote_askable: true
  - id: pulse_deficit
    question: "Pulse deficit or systolic blood pressure difference between limbs on clinician exam"
    remote_askable: false  # in-person exam
diagnoses:
  - id: acs
    label: "Acute coronary syndrome"
    cannot_miss: true
    prior:
      p: 0.036
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Haasenritter J et al. Croat Med J 2015;56(5):422-430 (PMID 26526879), Table 3, ACS/MI row, Bosner 2009 primary-care cohort: 3.6% of 1212 adults aged 35+ with chest pain"
    thresholds: {benefit: 100, harm: 1, test_se: 0.95, test_sp: 0.90, test_harm: 0.05, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    lrs:
      oppressive_pain: {lr_pos: 1.28, lr_neg: 0.71, lr_pos_ci: [1.06, 1.61], lr_neg_ci: [0.60, 0.87], source: "Raat W et al. Scand J Prim Health Care 2024;43(1):111-119 (PMID 39308022) Table 2, Oppressive chest pain, ACS, 7 studies"}
      radiation_left_arm: {lr_pos: 1.33, lr_neg: 0.87, lr_pos_ci: [1.22, 1.44], lr_neg_ci: [0.78, 0.94], group: radiation, source: "Raat 2024 (PMID 39308022) Table 2, Pain radiating to left arm, ACS, 4 studies"}
      radiation_right_arm: {lr_pos: 2.93, lr_neg: 0.84, lr_pos_ci: [0.72, 7.38], lr_neg_ci: [0.55, 1.04], group: radiation, source: "Raat 2024 (PMID 39308022) Table 2, Pain radiating to right arm, ACS, 1 study"}
      radiation_neck: {lr_pos: 1.38, lr_neg: 0.94, lr_pos_ci: [1.05, 1.75], lr_neg_ci: [0.85, 0.99], group: radiation, source: "Raat 2024 (PMID 39308022) Table 2, Pain radiating to neck, ACS, 4 studies"}
      radiation_back: {lr_pos: 1.18, lr_neg: 0.96, lr_pos_ci: [0.66, 1.85], lr_neg_ci: [0.77, 1.07], group: radiation, source: "Raat 2024 (PMID 39308022) Table 2, Pain radiating to back, ACS, 4 studies"}
      sweating: {lr_pos: 1.46, lr_neg: 0.85, lr_pos_ci: [1.28, 1.67], lr_neg_ci: [0.79, 0.90], group: autonomic, source: "Raat 2024 (PMID 39308022) Table 2, Sweating, ACS, 7 studies"}
      nausea_vomiting: {lr_pos: 1.20, lr_neg: 0.94, lr_pos_ci: [1.00, 1.46], lr_neg_ci: [0.90, 1.00], group: autonomic, source: "Raat 2024 (PMID 39308022) Table 2, Nausea and/or vomiting, ACS, 7 studies"}
      chest_wall_tenderness_absent: {lr_pos: 1.45, lr_neg: 0.24, lr_pos_ci: [1.10, 2.12], lr_neg_ci: [0.10, 0.51], source: "Raat 2024 (PMID 39308022) Table 2, Absence of chest wall tenderness, ACS, 3 studies"}
      known_vascular_disease: {lr_pos: 3.94, lr_neg: 0.50, lr_pos_ci: [2.78, 5.90], lr_neg_ci: [0.33, 0.70], source: "Bosner S et al. Br J Gen Pract 2010;60(575):e246-57 (PMID 20529488) Table 3, Known clinical vascular disease, reference condition 'indication for urgent hospital admission' (proxy for ACS)"}
  - id: coronary_heart_disease
    label: "Coronary heart disease, stable angina or ACS (needs non-urgent or urgent cardiac work-up)"
    cannot_miss: false
    prior:
      p: 0.149
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Bosner S et al. Br J Gen Pract 2010 (PMID 20529488) Results text: CHD in 180 of 1199 (14.9%) primary-care adults aged 35+ with chest pain"
    lrs:
      pain_worse_exercise: {lr_pos: 2.53, lr_neg: 0.68, lr_pos_ci: [2.04, 3.14], lr_neg_ci: [0.60, 0.78], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Pain worse with exercise, any CHD"}
      known_vascular_disease: {lr_pos: 4.51, lr_neg: 0.54, lr_pos_ci: [3.63, 5.62], lr_neg_ci: [0.46, 0.63], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Known clinical vascular disease, any CHD"}
      known_heart_failure: {lr_pos: 3.95, lr_neg: 0.86, lr_pos_ci: [2.60, 6.13], lr_neg_ci: [0.81, 0.93], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Known heart failure, any CHD"}
      known_diabetes: {lr_pos: 2.55, lr_neg: 0.81, lr_pos_ci: [1.90, 3.44], lr_neg_ci: [0.74, 0.89], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Known diabetes, any CHD"}
      age_risk: {lr_pos: 1.85, lr_neg: 0.32, lr_pos_ci: [1.69, 2.05], lr_neg_ci: [0.23, 0.44], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Age (female >=65 years, male >=55 years), any CHD"}
      patient_thinks_heart: {lr_pos: 1.43, lr_neg: 0.39, lr_pos_ci: [1.31, 1.56], lr_neg_ci: [0.27, 0.57], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Patient assumes cardiac origin of pain, any CHD"}
      stinging_pain: {lr_pos: 0.45, lr_neg: 1.41, lr_pos_ci: [0.33, 0.62], lr_neg_ci: [1.29, 1.54], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Stinging pain, any CHD"}
      cough: {lr_pos: 0.27, lr_neg: 1.12, lr_pos_ci: [0.13, 0.57], lr_neg_ci: [1.08, 1.17], source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Cough present, any CHD"}
      localised_muscle_tension: {lr_pos: 0.38, lr_neg: 1.68, lr_pos_ci: [0.29, 0.58], lr_neg_ci: [1.38, 1.70], group: chest_wall, source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Localised muscle tension, any CHD"}
      pain_reproducible_palpation: {lr_pos: 0.25, lr_neg: 1.71, lr_pos_ci: [0.15, 0.41], lr_neg_ci: [1.56, 1.89], group: chest_wall, source: "Bosner 2010 BJGP (PMID 20529488) Table 3, Pain reproducible by palpation, any CHD"}
  - id: pulmonary_embolism
    label: "Pulmonary embolism"
    cannot_miss: true
    prior:
      p: 0.0017
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Bosner 2010 BJGP (PMID 20529488) Results text: pulmonary embolism in 2 of 1199 primary-care adults with chest pain (counted among urgent admissions)"
    thresholds: {benefit: 50, harm: 1, test_se: 0.97, test_sp: 0.40, test_harm: 0.05, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    lrs:
      history_vte: {lr_pos: 2.86, lr_neg: 0.80, lr_pos_ci: [2.46, 3.33], lr_neg_ci: [0.76, 0.85], source: "DERIVED from Courtney DM et al. Ann Emerg Med 2010;55(4):307-315.e1 (PMID 20045580) web-appendix table counts TP155 FN413 FP703 TN6669; VTE outcome; log-method 95% CI"}
      unilateral_leg_swelling: {lr_pos: 3.05, lr_neg: 0.83, lr_pos_ci: [2.58, 3.60], lr_neg_ci: [0.79, 0.87], source: "DERIVED from Courtney 2010 (PMID 20045580) web-appendix counts TP135 FN433 FP575 TN6797; log-method 95% CI"}
      recent_surgery: {lr_pos: 2.57, lr_neg: 0.90, lr_pos_ci: [2.07, 3.19], lr_neg_ci: [0.87, 0.93], group: vte_provoked, source: "DERIVED from Courtney 2010 (PMID 20045580) web-appendix counts TP86 FN482 FP434 TN6938; log-method 95% CI"}
      immobilization: {lr_pos: 2.54, lr_neg: 0.85, lr_pos_ci: [2.14, 3.02], lr_neg_ci: [0.82, 0.89], group: vte_provoked, source: "DERIVED from Courtney 2010 (PMID 20045580) web-appendix counts TP125 FN443 FP638 TN6734; log-method 95% CI"}
      active_cancer: {lr_pos: 2.73, lr_neg: 0.90, lr_pos_ci: [2.20, 3.40], lr_neg_ci: [0.87, 0.93], source: "DERIVED from Courtney 2010 (PMID 20045580) web-appendix counts TP85 FN483 FP404 TN6968; log-method 95% CI"}
      pleuritic_pain: {lr_pos: 1.05, lr_neg: 0.96, lr_pos_ci: [0.96, 1.15], lr_neg_ci: [0.88, 1.04], source: "DERIVED from Courtney 2010 (PMID 20045580) web-appendix counts TP274 FN294 FP3386 TN3986; log-method 95% CI"}
      substernal_pain: {lr_pos: 0.56, lr_neg: 1.27, lr_pos_ci: [0.48, 0.66], lr_neg_ci: [1.21, 1.33], source: "DERIVED from Courtney 2010 (PMID 20045580) web-appendix counts TP121 FN447 FP2788 TN4584; log-method 95% CI"}
      hypoxemia: {lr_pos: 2.39, lr_neg: 0.70, lr_pos_ci: [2.14, 2.66], lr_neg_ci: [0.65, 0.75], source: "DERIVED from Courtney 2010 (PMID 20045580) web-appendix counts TP240 FN327 FP1304 TN6045; log-method 95% CI"}
  - id: aortic_dissection
    label: "Acute aortic dissection (acute aortic syndrome)"
    cannot_miss: true
    prior:
      p: 0.00102
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Alter SM et al. West J Emerg Med 2015;16(5):629-631 (PMID 26587083) Results: 1 dissection per 980 (95% CI 910-1,050) ED patients with atraumatic chest pain"
    thresholds: {benefit: 200, harm: 1, test_se: 0.98, test_sp: 0.95, test_harm: 0.10, source: "Drafted value accepted at physician review on 2026-10-28; not derived from a formal decision analysis"}
    lrs:
      sudden_onset: {lr_pos: 1.44, lr_neg: 0.66, lr_pos_ci: [1.15, 1.80], lr_neg_ci: [0.49, 0.89], group: aas_pain, source: "DERIVED from Morello F et al. Sci Rep 2020;10(1):3103 (PMID 32080259) Table 2 counts, Sudden pain TP55 FN33 FP91 TN118; suspected-AAS ED population; log-method 95% CI"}
      severe_pain: {lr_pos: 1.48, lr_neg: 0.87, lr_pos_ci: [0.99, 2.21], lr_neg_ci: [0.74, 1.02], group: aas_pain, source: "DERIVED from Morello 2020 (PMID 32080259) Table 2 counts, Severe pain TP28 FN60 FP45 TN164; log-method 95% CI"}
      ripping_tearing_pain: {lr_pos: 3.96, lr_neg: 0.82, lr_pos_ci: [2.02, 7.74], lr_neg_ci: [0.73, 0.92], group: aas_pain, source: "DERIVED from Morello 2020 (PMID 32080259) Table 2 counts, Ripping/tearing pain TP20 FN68 FP12 TN197; log-method 95% CI"}
      known_thoracic_aneurysm: {lr_pos: 2.62, lr_neg: 0.84, lr_pos_ci: [1.49, 4.63], lr_neg_ci: [0.74, 0.95], source: "DERIVED from Morello 2020 (PMID 32080259) Table 2 counts, Thoracic aortic aneurysm TP21 FN67 FP19 TN190; log-method 95% CI"}
      hypertension: {lr_pos: 1.29, lr_neg: 0.65, lr_pos_ci: [1.08, 1.55], lr_neg_ci: [0.46, 0.93], source: "DERIVED from Morello 2020 (PMID 32080259) Table 1 counts, Hypertension TP62 FN26 FP114 TN95; log-method 95% CI"}
      pulse_deficit: {lr_pos: 5.43, lr_neg: 0.85, lr_pos_ci: [2.31, 12.73], lr_neg_ci: [0.76, 0.94], source: "DERIVED from Morello 2020 (PMID 32080259) Table 2 counts, Pulse deficit TP16 FN72 FP7 TN202; log-method 95% CI"}
  - id: chest_wall_syndrome
    label: "Chest wall syndrome (musculoskeletal chest pain)"
    cannot_miss: false
    prior:
      p: 0.498
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Haasenritter 2015 Croat Med J (PMID 26526879) Table 3, chest wall syndrome row, Bosner 2009 primary-care cohort: 49.8% of 1212"
  - id: gerd
    label: "Gastro-oesophageal reflux disease"
    cannot_miss: false
    prior:
      p: 0.035
      source: "Literature value (a later version replaces it with the Waymark claims rate); literature value from Bosner S et al. Int Arch Med 2009;2:40 (PMID 20003376) Results text: GERD in 42 of 1212 primary-care adults aged 35+ with chest pain"
